[package]
name = "linmacro"
version = "0.1.0"
edition = "2021"
authors = ["lowell"]
description = "Modern, lightweight Linux macro automation tool for Wayland & X11"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wayland", "x11", "wgpu"] }
evdev = { version = "0.13.2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
